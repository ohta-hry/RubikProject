<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Rubik Notation Tool</title>
    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">

        <!-- ヘッダー -->
        <header class="header">
            <h1 class="header-title">Rubik Notation Tool</h1>
        </header>

        <!-- Three.js 表示エリア（高さは画面比率で決定） -->
        <section class="stage" aria-label="3Dビュー">
            <div id="canvas-container"></div>
            <!-- 入力の反映待ち表示：3Dビューを暗くして Loading.. を出す -->
            <div id="stage-veil" class="stage-veil" aria-live="polite" hidden>
                <span class="veil-label">Loading..</span>
            </div>
        </section>

        <!-- 再生バー -->
        <section class="player" aria-label="再生コントロール">
            <input id="seek-bar" class="seek" type="range" min="0" max="1000" value="0" aria-label="シークバー">
            <div class="transport">
                <button id="prev-button" class="icon-btn" type="button" aria-label="最初へ">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg>
                </button>
                <button id="play-button" class="icon-btn icon-btn-main" type="button" data-state="paused" aria-label="再生">
                    <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15L19.5 12z"/></svg>
                    <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4.5v14H6zM13.5 5H18v14h-4.5z"/></svg>
                </button>
                <button id="next-button" class="icon-btn" type="button" aria-label="最後へ">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5l10.5 7L4 19z"/></svg>
                </button>
            </div>
        </section>

        <!-- 入力欄 -->
        <section class="dock" aria-label="入力パネル">
            <div class="dock-tabs" id="dock-tabs" role="tablist">
                <button class="dock-tab active" type="button" role="tab" id="tab-input" aria-controls="page-input" aria-selected="true" data-page="input">入力</button>
                <button class="dock-tab" type="button" role="tab" id="tab-analysis" aria-controls="page-analysis" aria-selected="false" data-page="analysis">分析</button>
                <button class="dock-tab" type="button" role="tab" id="tab-marker" aria-controls="page-marker" aria-selected="false" data-page="marker">マーカー</button>
                <button class="dock-tab" type="button" role="tab" id="tab-settings" aria-controls="page-settings" aria-selected="false" data-page="settings">設定</button>
            </div>

            <div class="dock-body">

                <!-- 入力ページ -->
                <div class="page active" id="page-input" role="tabpanel" aria-labelledby="tab-input">

                    <!-- 先行動作の開閉 ＋ モード切替 -->
                    <div class="head-row">
                        <button id="preset-toggle" class="preset-toggle" type="button" aria-expanded="false" aria-controls="preset-body">
                            <span class="preset-caret" aria-hidden="true">▼</span>先行動作
                        </button>
                        <button id="mode-toggle" class="mode-btn" type="button" data-mode="solve" aria-label="ソルブ" aria-pressed="true">
                            <svg class="mode-icon icon-scramble" viewBox="4 3 102 56" fill="none" aria-hidden="true">
      <g stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <path fill="#fff" fill-opacity=".30" d="M12 19 L34 7 L56 19 L34 31 Z"/>
        <path fill="#fff" fill-opacity=".12" d="M12 19 L34 31 L34 57 L12 45 Z"/>
        <path d="M34 31 L56 19 L56 45 L34 57 Z"/>
      </g>
      <circle class="badge" cx="57" cy="15" r="11" stroke="currentColor" stroke-width="3"/>
      <path d="M51 15 L55 19 L63 10" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M70 36 H99 M90 26 L99 36 L90 46" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
                            <svg class="mode-icon icon-solve" viewBox="6 3 102 56" fill="none" aria-hidden="true">
      <path d="M8 36 H37 M28 26 L37 36 L28 46" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <g stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <path fill="#fff" fill-opacity=".30" d="M50 19 L72 7 L94 19 L72 31 Z"/>
        <path fill="#fff" fill-opacity=".12" d="M50 19 L72 31 L72 57 L50 45 Z"/>
        <path d="M72 31 L94 19 L94 45 L72 57 Z"/>
      </g>
      <circle class="badge" cx="95" cy="15" r="11" stroke="currentColor" stroke-width="3"/>
      <path d="M89 15 L93 19 L101 10" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
                        </button>
                    </div>

                    <!-- 先行動作（既定は折りたたみ） -->
                    <div id="preset-body" class="preset-body">
                        <div class="preset-inner">
                            <textarea id="preset-input" class="text-input" rows="1" placeholder="先行動作" aria-label="先行動作" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
                        </div>
                    </div>

                    <!-- 回転動作 -->
                    <label class="field-label" for="moves-input">回転動作</label>
                    <textarea id="moves-input" class="text-input" rows="1" aria-label="回転動作" autocomplete="off" autocapitalize="off" spellcheck="false">R U R' U'</textarea>

                    <!-- キーボードボタン（入力は1秒変化がなければ自動反映） -->
                    <div id="action-row" class="action-row">
                        <button id="keyboard-button" class="keyboard-btn" type="button" aria-pressed="false" aria-controls="rotation-keyboard">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
                            キーボード
                        </button>
                    </div>

                    <!-- 回転動作キーボード（キーボードボタンと入れ替わる） -->
                    <div id="rotation-keyboard" class="kb" role="group" aria-label="回転動作キーボード" hidden>
                        <div class="kb-pad">
                            <svg class="kb-cube" viewBox="-127.5 -127.5 255 255" aria-hidden="true" focusable="false">
                                <g class="kb-guides">
                                    <line x1="-45.0" y1="-26.0" x2="-86.6" y2="-50.0"/>
                                    <line x1="45.0" y1="-26.0" x2="86.6" y2="-50.0"/>
                                    <line x1="0.0" y1="52.0" x2="0.0" y2="100.0"/>
                                </g>
                                <path class="kb-cube-body" d="M-45.0 -26.0 L0.0 -52.0 L45.0 -26.0 L45.0 26.0 L0.0 52.0 L-45.0 26.0Z"/>
                                <g class="kb-stickers">
                                    <path class="st-u" d="M0.0 -1.6 L12.3 -8.7 L0.0 -15.8 L-12.3 -8.7Z M15.0 -10.2 L27.3 -17.3 L15.0 -24.4 L2.7 -17.3Z M30.0 -18.9 L42.3 -26.0 L30.0 -33.1 L17.7 -26.0Z M-15.0 -10.2 L-2.7 -17.3 L-15.0 -24.4 L-27.3 -17.3Z M0.0 -18.9 L12.3 -26.0 L0.0 -33.1 L-12.3 -26.0Z M15.0 -27.6 L27.3 -34.7 L15.0 -41.8 L2.7 -34.7Z M-30.0 -18.9 L-17.7 -26.0 L-30.0 -33.1 L-42.3 -26.0Z M-15.0 -27.6 L-2.7 -34.7 L-15.0 -41.8 L-27.3 -34.7Z M0.0 -36.2 L12.3 -43.3 L0.0 -50.4 L-12.3 -43.3Z"/>
                                    <path class="st-f" d="M-1.4 0.8 L-13.7 -6.3 L-13.7 7.9 L-1.4 15.0Z M-16.4 -7.9 L-28.7 -15.0 L-28.7 -0.8 L-16.4 6.3Z M-31.4 -16.6 L-43.7 -23.7 L-43.7 -9.4 L-31.4 -2.3Z M-1.4 18.1 L-13.7 11.0 L-13.7 25.2 L-1.4 32.3Z M-16.4 9.4 L-28.7 2.3 L-28.7 16.6 L-16.4 23.7Z M-31.4 0.8 L-43.7 -6.3 L-43.7 7.9 L-31.4 15.0Z M-1.4 35.4 L-13.7 28.3 L-13.7 42.6 L-1.4 49.7Z M-16.4 26.8 L-28.7 19.7 L-28.7 33.9 L-16.4 41.0Z M-31.4 18.1 L-43.7 11.0 L-43.7 25.2 L-31.4 32.3Z"/>
                                    <path class="st-r" d="M1.4 0.8 L13.7 -6.3 L13.7 7.9 L1.4 15.0Z M16.4 -7.9 L28.7 -15.0 L28.7 -0.8 L16.4 6.3Z M31.4 -16.6 L43.7 -23.7 L43.7 -9.4 L31.4 -2.3Z M1.4 18.1 L13.7 11.0 L13.7 25.2 L1.4 32.3Z M16.4 9.4 L28.7 2.3 L28.7 16.6 L16.4 23.7Z M31.4 0.8 L43.7 -6.3 L43.7 7.9 L31.4 15.0Z M1.4 35.4 L13.7 28.3 L13.7 42.6 L1.4 49.7Z M16.4 26.8 L28.7 19.7 L28.7 33.9 L16.4 41.0Z M31.4 18.1 L43.7 11.0 L43.7 25.2 L31.4 32.3Z"/>
                                </g>
                            </svg>
                            <button class="kb-key" type="button" data-move="U" style="--a:-90deg" aria-label="U を入力">U</button>
                            <button class="kb-key" type="button" data-move="L" style="--a:-150deg" aria-label="L を入力">L</button>
                            <button class="kb-key" type="button" data-move="B" style="--a:-30deg" aria-label="B を入力">B</button>
                            <button class="kb-key" type="button" data-move="F" style="--a:150deg" aria-label="F を入力">F</button>
                            <button class="kb-key" type="button" data-move="R" style="--a:30deg" aria-label="R を入力">R</button>
                            <button class="kb-key" type="button" data-move="D" style="--a:90deg" aria-label="D を入力">D</button>
                        </div>
                        <button id="keyboard-close" class="kb-close" type="button">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                            閉じる
                        </button>
                    </div>

                    <!-- エラー時のみ表示 -->
                    <div id="status-message" class="status" role="alert" hidden></div>
                </div>

                <!-- 未定ページ -->
                <div class="page" id="page-analysis" role="tabpanel" aria-labelledby="tab-analysis"></div>
                <div class="page" id="page-marker" role="tabpanel" aria-labelledby="tab-marker"></div>
                <div class="page" id="page-settings" role="tabpanel" aria-labelledby="tab-settings"></div>

            </div>
        </section>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
                "OrbitControls": "https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/controls/OrbitControls.js"
            }
        }
    </script>

    <!-- モジュールの読み込み -->
    <script type="module" src="./src/js/main.js"></script>
</body>
</html>
